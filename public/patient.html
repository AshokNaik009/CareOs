<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafeeq — Patient agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Martian+Mono:wght@400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Rafeeq <span class="ar">رفيق</span> <small>Personal health agent</small></a>
  <nav class="nav"><a class="active" href="/patient.html">Patient agent</a><a href="/provider.html">Care OS</a></nav>
  <div class="spacer"></div>
  <select id="patientSel" aria-label="Patient"></select>
  <button class="reset-btn" id="resetBtn" title="Restore the original synthetic data">Reset demo</button>
  <div class="seg" id="langSeg"><button data-lang="en">English</button><button data-lang="ar">عربي</button></div>
</header>
<div class="banner" id="banner" hidden></div>

<main class="page grid-3">
  <!-- record -->
  <section>
    <div class="card" id="profile"></div>
    <div class="card"><h2>Lab results <span class="source">Malaffi</span></h2><div id="labs"></div></div>
    <div class="card"><h2>Genome <span class="source" id="genomeSrc">Genome report</span></h2><div id="genome"></div></div>
    <div class="card"><h2>Wearable <span class="source" id="wearSrc">Device</span></h2><div id="wearable"></div></div>
    <div class="card"><h2>Medications</h2><div id="meds"></div></div>
  </section>

  <!-- agent -->
  <section>
    <div class="card agent">
      <h2 style="justify-content:center">Talk to Rafeeq</h2>
      <div class="orb-wrap"><div class="orb idle" id="orb"></div></div>
      <div class="agent-status" id="agentStatus">Ready when you are.</div>
      <div class="btns">
        <button class="btn primary" id="talkBtn">Start voice</button>
        <button class="btn" id="typeBtn">Type instead</button>
        <button class="btn danger" id="endBtn" hidden>End</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="transcript" id="transcript"></div>
      <form class="composer" id="composer" hidden>
        <input id="msgInput" autocomplete="off" placeholder="Type a message…" dir="auto">
        <button class="btn primary sm" type="submit">Send</button>
      </form>
      <div id="noteBox"></div>
    </div>
  </section>

  <!-- findings + actions -->
  <section>
    <div class="card"><h2>Safety net: missed findings <span class="source" id="findCount"></span></h2><div id="findings"></div></div>
    <div class="card"><h2>Done on your behalf</h2><div id="actions"><div class="empty">Nothing yet. Ask Rafeeq to act.</div></div></div>
  </section>
</main>

<script src="/vendor/elevenlabs-client.js"></script>
<script src="/voice.js"></script>
<script src="/patient.js"></script>
</body>
</html>
